server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: measurement-service

          uri: lb://MEASUREMENT-SERVICE

          predicates:
            - Path=/api/measure/**

        - id: user-service

          uri: lb://USER-SERVICE

          predicates:
            - Path=/api/users/**

eureka:
  client:
    service-url:
      defaultZone:
        http://localhost:8761/eureka/